name: Scheduled Market Brief
# A Cloudflare wake-up carries the Worker's name; a manual dispatch keeps the workflow's. The Cloudflare Worker
# clears only its own never-started wakes, and the name is set when the run is created, before any job exists.
run-name: ${{ inputs.cloudflare_wakeup == true && 'Cloudflare wake-up' || 'Scheduled Market Brief' }}

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Checkpoint to run (ignored when commissioning or continuity_check is true)
        required: false
        default: PREMARKET
        type: choice
        options:
          - PREMARKET
          - OPEN_1M
          - OPEN_30M
          - HOURLY_1100
          - HOURLY_1200
          - HOURLY_1300
          - HOURLY_1400
          - HOURLY_1500
          - CLOSE_1M
      commissioning:
        description: Run a current-time live commissioning brief
        required: false
        default: false
        type: boolean
      experiment:
        description: Synthesis experiment only; retain the run as an artifact and never publish
        required: false
        default: false
        type: boolean
      continuity_check:
        description: Restore the production continuity bundle across a runner boundary and re-upload it under an isolated name; no collection, synthesis, or publishing
        required: false
        default: false
        type: boolean
      cloudflare_wakeup:
        description: Cloudflare Cron wake-up; resolve the checkpoint in the Python scheduler
        required: false
        default: false
        type: boolean
      cloudflare_smoke:
        description: Non-publishing Cloudflare dispatch smoke test
        required: false
        default: false
        type: boolean
      liveness_recovery:
        description: Set by the Cloudflare wake-up when it cleared a stalled run; printed in the log only. Leave empty
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: market-brief-pages
  cancel-in-progress: false

jobs:
  continuity-check:
    # Isolated: no Pages environment, no collection, no synthesis, no publishing. Proves the
    # runner-boundary restore and re-uploads whatever it restored under a separate artifact name.
    if: inputs.continuity_check == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Market Brief
        run: python -m pip install -e .
      - name: Restore continuity bundle from the last accepted production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m market_brief continuity-restore --repository "$GITHUB_REPOSITORY" --branch main
      - name: Re-upload under an isolated name
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-continuity-check
          path: runs/continuity/bundle.json
          if-no-files-found: warn
          retention-days: 7

  brief:
    if: inputs.continuity_check != true && inputs.cloudflare_smoke != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Market Brief
        run: python -m pip install -e .
      - name: Resolve checkpoint
        id: checkpoint
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CHECKPOINT: ${{ inputs.checkpoint }}
          INPUT_COMMISSIONING: ${{ inputs.commissioning }}
          INPUT_CLOUDFLARE_WAKEUP: ${{ inputs.cloudflare_wakeup }}
          LIVENESS_RECOVERY: ${{ inputs.liveness_recovery }}
        run: |
          if [ -n "$LIVENESS_RECOVERY" ]; then
            # The Worker's note on a stalled run it cleared before dispatching this one: one line, never a command.
            printf 'Liveness: %s\n' "$(printf '%s' "$LIVENESS_RECOVERY" | tr '\r\n' '  ' | cut -c1-1000)"
          fi
          if [ "$INPUT_COMMISSIONING" = "true" ]; then
            # The application resolves the market phase from the clock at collection time.
            checkpoint=CURRENT
            label="LIVE COMMISSIONING"
            run=true
          elif [ "$INPUT_CLOUDFLARE_WAKEUP" = "true" ]; then
            checkpoint=$(python -m market_brief resolve-scheduled)
            if [ "$checkpoint" = "SKIP" ]; then
              run=false
              label=SKIP
            else
              run=true
              label="$checkpoint"
            fi
          elif [ -n "$INPUT_CHECKPOINT" ]; then
            checkpoint="$INPUT_CHECKPOINT"
            label="$checkpoint"
            run=true
          else
            checkpoint=$(python -m market_brief resolve-scheduled)
            if [ "$checkpoint" = "SKIP" ]; then
              run=false
              label=SKIP
            else
              run=true
              label="$checkpoint"
            fi
          fi
          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Restore continuity bundle from the last accepted production run
        # Short-horizon operational continuity: the newest unexpired bundle uploaded by a main-branch run
        # of this workflow. The upload proves acceptance, so a push or Pages failure after it does not
        # disqualify the bundle; a cancelled run does. No eligible bundle is an explicit cold start; a restore
        # that cannot finish fails this step, so the run stops before collection and uploads no cold bundle.
        if: steps.checkpoint.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m market_brief continuity-restore --repository "$GITHUB_REPOSITORY" --branch main
      - name: Alpaca commissioning probe
        if: github.event_name == 'workflow_dispatch' && inputs.cloudflare_wakeup != true && steps.checkpoint.outputs.run == 'true'
        run: python -m market_brief alpaca-probe
      - name: Full Alpaca coverage probe
        if: github.event_name == 'workflow_dispatch' && inputs.cloudflare_wakeup != true && steps.checkpoint.outputs.run == 'true'
        run: python -m market_brief alpaca-probe --full
      - name: Collect, synthesize, validate, and render manually
        if: github.event_name == 'workflow_dispatch' && inputs.cloudflare_wakeup != true && steps.checkpoint.outputs.run == 'true'
        env:
          COMMISSIONING: ${{ inputs.commissioning }}
          EXPERIMENT: ${{ inputs.experiment }}
          CHECKPOINT: ${{ steps.checkpoint.outputs.checkpoint }}
        run: |
          # An experiment runs the checkpoint it was dispatched with; only a commissioning
          # experiment resolves the market phase from the clock.
          if [ "$EXPERIMENT" = "true" ] && [ "$COMMISSIONING" = "true" ]; then
            python -m market_brief premarket --commissioning --experiment
          elif [ "$EXPERIMENT" = "true" ]; then
            python -m market_brief premarket --checkpoint "$CHECKPOINT" --experiment
          elif [ "$COMMISSIONING" = "true" ]; then
            python -m market_brief premarket --commissioning
          else
            python -m market_brief premarket --checkpoint "$CHECKPOINT"
          fi
      - name: Collect, synthesize, validate, and render from Cloudflare wake-up
        if: inputs.cloudflare_wakeup == true && steps.checkpoint.outputs.run == 'true'
        env:
          # Lists earlier runs' paid-attempt records before a synthesis checkpoint may pay (actions: read).
          GH_TOKEN: ${{ github.token }}
        run: python -m market_brief schedule --checkpoint "${{ steps.checkpoint.outputs.checkpoint }}"
      - name: Collect, synthesize, validate, and render on GitHub schedule
        if: github.event_name != 'workflow_dispatch' && steps.checkpoint.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m market_brief schedule --checkpoint "${{ steps.checkpoint.outputs.checkpoint }}"
      - name: Upload accepted continuity bundle
        # Only after local acceptance: the bundle is written solely by accepted LIVE, non-experiment,
        # non-commissioning runs. This step inherits success() (no status function here, no
        # continue-on-error before it), so it runs only when the pipeline succeeded, and it precedes the
        # push and Pages: its artifact proves acceptance whatever publication does next.
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true && inputs.commissioning != true
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-continuity
          path: runs/continuity/bundle.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish latest successful brief
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add publish/index.html
          if git diff --cached --quiet; then
            echo "No publishable changes"
          else
            git commit -m "Publish ${{ steps.checkpoint.outputs.label }} brief"
            git push
          fi
      - name: Deploy only the page main holds
        # The checkout is main as it was at dispatch. A run that skipped a checkpoint an earlier run published (a
        # duplicate or queue-delayed wake) would otherwise put its older page back over the newer one. Pages is
        # deployed only when this checkout's publish/ is main's; a fetch that fails fails the step, so nothing is
        # deployed on an unanswered question. It changes no file and follows the continuity upload and the push.
        id: current
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true
        env:
          LABEL: ${{ steps.checkpoint.outputs.label }}
        run: |
          git fetch --no-tags --depth=1 origin main
          if git diff --quiet HEAD FETCH_HEAD -- publish; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "NOT DEPLOYED / $LABEL / this checkout's page is behind main; the newer page stays live"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true && steps.current.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true && steps.current.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - name: Deploy Pages
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true && steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Archive this run's evidence, context, narrative, and metadata
        # Outside the Pages payload and Git history; thirty-day retention, not a historical store. Diagnostic only,
        # so it comes after the continuity upload and publication, where its own failure can gate neither, and runs
        # always(), so a rejected synthesis or a failed publication is still archived.
        if: always() && steps.checkpoint.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-run-${{ steps.checkpoint.outputs.checkpoint }}-${{ github.run_id }}
          path: |
            runs/
            !runs/continuity/
          if-no-files-found: ignore
          retention-days: 30
      - name: Name this run's paid synthesis attempt
        # A production synthesis writes runs/attempts/<session>-<checkpoint>.json before its provider request is
        # sent, whatever it then does. These two steps come last and run always(), so they record a rejected or
        # cancelled attempt too and can never gate continuity or publication; this workflow's concurrency group
        # starts no other run until they have finished.
        id: attempt
        if: always() && steps.checkpoint.outputs.run == 'true'
        run: |
          for record in runs/attempts/*.json; do
            if [ -f "$record" ]; then echo "key=$(basename "$record" .json)" >> "$GITHUB_OUTPUT"; fi
          done
      - name: Upload the paid synthesis attempt record
        if: always() && steps.attempt.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-attempt-${{ steps.attempt.outputs.key }}
          path: runs/attempts/${{ steps.attempt.outputs.key }}.json
          if-no-files-found: error
          retention-days: 30

  cloudflare-smoke:
    if: inputs.cloudflare_smoke == true && inputs.cloudflare_wakeup == true
    runs-on: ubuntu-latest
    steps:
      - name: Confirm non-publishing Cloudflare wake-up dispatch
        run: |
          echo "Cloudflare wake-up dispatch received by GitHub Actions."
          echo "No collection, synthesis, validation, rendering, or publication was run."
