name: One-shot Live Synthesis Preflight

on:
  push:
    branches:
      - "preflight/live-openrouter-20260917"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Market Brief
        run: python -m pip install -e .
      - name: Verify required credentials are present
        run: |
          test -n "$APCA_API_KEY_ID"
          test -n "$APCA_API_SECRET_KEY"
          test -n "$OPENROUTER_API_KEY"
      - name: Restore production continuity for realistic context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m market_brief continuity-restore --repository "$GITHUB_REPOSITORY" --branch main
      - name: Run live rich synthesis experiment
        run: python -m market_brief premarket --checkpoint PREMARKET --experiment
      - name: Archive diagnostic run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-synthesis-preflight-${{ github.run_id }}
          path: |
            runs/
            output/
          if-no-files-found: warn
          retention-days: 7
