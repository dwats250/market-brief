[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-brief"
version = "0.1.0"
description = "A local evidence-first pre-market briefing desk"
requires-python = ">=3.11"
dependencies = ["Jinja2==3.1.6", "exchange-calendars==4.13.2", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[project.scripts]
market-brief = "market_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
