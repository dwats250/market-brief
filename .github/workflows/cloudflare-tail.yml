name: Tail Cloudflare Scheduler Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --no-save wrangler@3.90.0
      - name: Query scheduler Worker logs
        run: |
          NOW_MS=$(date +%s%3N)
          FROM_MS=$((NOW_MS - 86400000))
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
              queryId: "market-brief-scheduler-diagnostic",
              timeframe: {from: $from, to: $to},
              view: "events",
              limit: 5,
              parameters: {
                datasets: ["cloudflare-workers"],
                filterCombination: "and",
                filters: [
                  {key: "$metadata.service", operation: "eq", type: "string", value: "market-brief-scheduler"},
                  {key: "$metadata.message", operation: "includes", type: "string", value: "github_workflow_dispatch_rejected"}
                ]
              }
            }')" \
            | jq -r '.result.events.events[]? | (.source | tostring)[0:1200]'
