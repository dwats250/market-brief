name: Tail Cloudflare Scheduler Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-dispatch-probe:
    runs-on: ubuntu-latest
    env:
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - name: Probe GitHub workflow dispatch API
        run: |
          test -n "$GH_DISPATCH_TOKEN"
          status=$(curl --silent --show-error \
            -o /tmp/github-response \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/dwats250/market-brief/actions/workflows/schedule.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: market-brief-dispatch-probe" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"__market_brief_dispatch_probe_invalid_ref__","inputs":{"cloudflare_wakeup":"true","cloudflare_smoke":"true"}}')
          echo "GitHub dispatch HTTP status: $status"
          echo "GitHub dispatch response:"
          head -c 1000 /tmp/github-response
          echo
          test "$status" = "422"

  tail:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --no-save wrangler@3.90.0
      - name: Query scheduler Worker logs
        run: |
          NOW_MS=$(date +%s%3N)
          FROM_MS=$((NOW_MS - 86400000))
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
              queryId: "market-brief-scheduler-diagnostic",
              timeframe: {from: $from, to: $to},
              view: "events",
              limit: 20,
              parameters: {
                datasets: ["cloudflare-workers"],
                filterCombination: "and"
              }
            }')" \
            | jq -c '.result.events.events[]? | .["$metadata"] | {
                timestamp, service, origin, trigger, error, message
              }'
