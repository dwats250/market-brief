name: Deploy Cloudflare Scheduler

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require GitHub dispatch credential
        run: test -n "$GH_DISPATCH_TOKEN"
      - name: Deploy scheduler Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.toml
      - name: Configure GitHub dispatch credential
        run: |
          printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN --config cloudflare/wrangler.toml
      - name: Verify GitHub dispatch credential binding
        run: |
          npx wrangler secret list --config cloudflare/wrangler.toml | grep -Eq '"name"[[:space:]]*:[[:space:]]*"GH_DISPATCH_TOKEN"'
