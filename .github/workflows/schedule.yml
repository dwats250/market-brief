name: Scheduled Market Brief

on:
  schedule:
    - cron: "0 6 * * 1-5"
      timezone: America/Vancouver
    - cron: "31 6 * * 1-5"
      timezone: America/Vancouver
    - cron: "0 7 * * 1-5"
      timezone: America/Vancouver
    - cron: "7 12 * * 1-5"
      timezone: America/Vancouver
    - cron: "1 13 * * 1-5"
      timezone: America/Vancouver
    - cron: "1 10 * * 1-5"
      timezone: America/Vancouver
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Checkpoint to run
        required: true
        type: choice
        options:
          - PREMARKET
          - OPEN_1M
          - OPEN_30M
          - AFTERNOON
          - CLOSE_1M

permissions:
  contents: write

concurrency:
  group: market-brief-schedule
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
      env:
        APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
        APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Market Brief
        run: python -m pip install -e .
      - name: Resolve checkpoint
        id: checkpoint
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          if [ -n "$INPUT_CHECKPOINT" ]; then
            checkpoint="$INPUT_CHECKPOINT"
          else
            case "$EVENT_SCHEDULE" in
              "0 6 * * 1-5") checkpoint=PREMARKET ;;
              "31 6 * * 1-5") checkpoint=OPEN_1M ;;
              "0 7 * * 1-5") checkpoint=OPEN_30M ;;
              "7 12 * * 1-5") checkpoint=AFTERNOON ;;
              "1 13 * * 1-5") checkpoint=CLOSE_1M ;;
              "1 10 * * 1-5") checkpoint=CLOSE_1M ;;
              *) echo "Unknown scheduled checkpoint: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"
      - name: Alpaca commissioning probe
        if: github.event_name == 'workflow_dispatch'
        run: python -m market_brief alpaca-probe
      - name: Full Alpaca coverage probe
        if: github.event_name == 'workflow_dispatch'
        run: python -m market_brief alpaca-probe --full
      - name: Collect, synthesize, validate, and render manually
        if: github.event_name == 'workflow_dispatch'
        run: python -m market_brief premarket --checkpoint "${{ steps.checkpoint.outputs.checkpoint }}"
      - name: Collect, synthesize, validate, and render on schedule
        if: github.event_name != 'workflow_dispatch'
        run: python -m market_brief schedule --checkpoint "${{ steps.checkpoint.outputs.checkpoint }}"
      - name: Publish latest successful brief
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add publish/index.html
          if git diff --cached --quiet; then
            echo "No publishable changes"
          else
            git commit -m "Publish ${{ steps.checkpoint.outputs.checkpoint }} brief"
            git push
          fi
