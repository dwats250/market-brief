name: Scheduled Market Brief

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Checkpoint to run (ignored when commissioning or continuity_check is true)
        required: false
        default: PREMARKET
        type: choice
        options:
          - PREMARKET
          - OPEN_1M
          - OPEN_30M
          - AFTERNOON
          - CLOSE_1M
      commissioning:
        description: Run a current-time live commissioning brief
        required: false
        default: false
        type: boolean
      experiment:
        description: Synthesis experiment only; retain the run as an artifact and never publish
        required: false
        default: false
        type: boolean
      continuity_check:
        description: Restore the production continuity bundle across a runner boundary and re-upload it under an isolated name; no collection, synthesis, or publishing
        required: false
        default: false
        type: boolean
      cloudflare_wakeup:
        description: Cloudflare Cron wake-up; resolve the checkpoint in the Python scheduler
        required: false
        default: false
        type: boolean
      cloudflare_smoke:
        description: Non-publishing Cloudflare dispatch smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: market-brief-pages
  cancel-in-progress: false

jobs:
  continuity-check:
    # Isolated: no Pages environment, no collection, no synthesis, no publishing. Proves the
    # runner-boundary restore and re-uploads whatever it restored under a separate artifact name.
    if: inputs.continuity_check == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Market Brief
        run: python -m pip install -e .
      - name: Restore continuity bundle from the last accepted production run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m market_brief continuity-restore --repository "$GITHUB_REPOSITORY" --branch main
      - name: Re-upload under an isolated name
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-continuity-check
          path: runs/continuity/bundle.json
          if-no-files-found: warn
          retention-days: 7

  brief:
    if: inputs.continuity_check != true && inputs.cloudflare_smoke != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Market Brief
        run: python -m pip install -e .
      - name: Resolve checkpoint
        id: checkpoint
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CHECKPOINT: ${{ inputs.checkpoint }}
          INPUT_COMMISSIONING: ${{ inputs.commissioning }}
          INPUT_CLOUDFLARE_WAKEUP: ${{ inputs.cloudflare_wakeup }}
        run: |
          if [ "$INPUT_COMMISSIONING" = "true" ]; then
            # The application resolves the market phase from the clock at collection time.
            checkpoint=CURRENT
            label="LIVE COMMISSIONING"
            run=true
          elif [ "$INPUT_CLOUDFLARE_WAKEUP" = "true" ]; then
            checkpoint=$(python -m market_brief resolve-scheduled)
            if [ "$checkpoint" = "SKIP" ]; then
              run=false
              label=SKIP
            else
              run=true
              label="$checkpoint"
            fi
          elif [ -n "$INPUT_CHECKPOINT" ]; then
            checkpoint="$INPUT_CHECKPOINT"
            label="$checkpoint"
            run=true
          else
            checkpoint=$(python -m market_brief resolve-scheduled)
            if [ "$checkpoint" = "SKIP" ]; then
              run=false
              label=SKIP
            else
              run=true
              label="$checkpoint"
            fi
          fi
          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Restore continuity bundle from the last accepted production run
        # Short-horizon operational continuity: the newest unexpired bundle uploaded by a
        # successful main-branch run of this workflow. Anything else is an explicit cold start.
        if: steps.checkpoint.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m market_brief continuity-restore --repository "$GITHUB_REPOSITORY" --branch main
      - name: Alpaca commissioning probe
        if: github.event_name == 'workflow_dispatch' && inputs.cloudflare_wakeup != true && steps.checkpoint.outputs.run == 'true'
        run: python -m market_brief alpaca-probe
      - name: Full Alpaca coverage probe
        if: github.event_name == 'workflow_dispatch' && inputs.cloudflare_wakeup != true && steps.checkpoint.outputs.run == 'true'
        run: python -m market_brief alpaca-probe --full
      - name: Collect, synthesize, validate, and render manually
        if: github.event_name == 'workflow_dispatch' && inputs.cloudflare_wakeup != true && steps.checkpoint.outputs.run == 'true'
        env:
          COMMISSIONING: ${{ inputs.commissioning }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          if [ "$EXPERIMENT" = "true" ]; then
            python -m market_brief premarket --commissioning --experiment
          elif [ "$COMMISSIONING" = "true" ]; then
            python -m market_brief premarket --commissioning
          else
            # One-time production recovery: permit at most one synthesis request.
            if [ "${{ steps.checkpoint.outputs.checkpoint }}" = "CLOSE_1M" ]; then
              sed -i 's/for attempt in range(3):/for attempt in range(1):/' src/market_brief/synthesize.py
              trap 'git checkout -- src/market_brief/synthesize.py' EXIT
            fi
            python -m market_brief premarket --checkpoint "${{ steps.checkpoint.outputs.checkpoint }}"
          fi
      - name: Collect, synthesize, validate, and render from Cloudflare wake-up
        if: inputs.cloudflare_wakeup == true && steps.checkpoint.outputs.run == 'true'
        run: python -m market_brief schedule --checkpoint "${{ steps.checkpoint.outputs.checkpoint }}"
      - name: Collect, synthesize, validate, and render on GitHub schedule
        if: github.event_name != 'workflow_dispatch' && steps.checkpoint.outputs.run == 'true'
        run: python -m market_brief schedule --checkpoint "${{ steps.checkpoint.outputs.checkpoint }}"
      - name: Archive this run's evidence, context, narrative, and metadata
        # Outside the Pages payload and Git history; thirty-day retention, not a historical store.
        if: always() && steps.checkpoint.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-run-${{ steps.checkpoint.outputs.checkpoint }}-${{ github.run_id }}
          path: |
            runs/
            !runs/continuity/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload accepted continuity bundle
        # Only after local acceptance: the bundle is written solely by accepted LIVE, non-experiment,
        # non-commissioning runs. A failed run reaches this step only if the pipeline succeeded.
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true && inputs.commissioning != true
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-continuity
          path: runs/continuity/bundle.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish latest successful brief
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add publish/index.html
          if git diff --cached --quiet; then
            echo "No publishable changes"
          else
            git commit -m "Publish ${{ steps.checkpoint.outputs.label }} brief"
            git push
          fi
      - name: Configure Pages
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - name: Deploy Pages
        if: steps.checkpoint.outputs.run == 'true' && inputs.experiment != true
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-smoke:
    if: inputs.cloudflare_smoke == true && inputs.cloudflare_wakeup == true
    runs-on: ubuntu-latest
    steps:
      - name: Confirm non-publishing Cloudflare wake-up dispatch
        run: |
          echo "Cloudflare wake-up dispatch received by GitHub Actions."
          echo "No collection, synthesis, validation, rendering, or publication was run."
