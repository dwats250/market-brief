name: One-shot Live Synthesis Preflight

on:
  push:
    branches:
      - "preflight/live-openrouter-20260917"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Market Brief
        run: python -m pip install -e .
      - name: Verify OpenRouter credential is present
        run: test -n "$OPENROUTER_API_KEY"
      - name: Run Anthropic contract matrix
        run: python scripts/preflight_openrouter_matrix.py
